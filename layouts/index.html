{{ define "hero" }}
<header class="hero"><div class="wrap">
  <h1>{{ .Site.Title }}</h1>
  <p>{{ .Site.Params.description }}</p>
</div></header>
{{ end }}

{{ define "main" }}
  {{ .Content }}
  <h2>Projects</h2>
  <ul class="card-list">
  {{ range where .Site.RegularPages "Section" "projects" }}
    <li><a class="card" href="{{ .RelPermalink }}">
      <h3>{{ .Title }}</h3>
      <p>{{ .Description }}</p>
    </a></li>
  {{ end }}
  </ul>
{{ end }}
